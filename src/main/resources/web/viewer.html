<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>CCTV</title>
	<link rel="stylesheet" href="/static/style.css">
</head>
<body class="viewer">
	<div id="screen">
		<canvas id="view"></canvas>
		<div id="fx"></div>
		<div id="noise"></div>

		<div class="hud top-left">
			<div class="cam"><span class="rec"></span><span id="cam-name">CAM</span></div>
			<div id="cam-sub" class="sub"></div>
		</div>
		<div class="hud top-right">
			<div id="clock"></div>
			<div id="game-time" class="sub"></div>
		</div>
		<div class="hud bottom-left"><span id="status" data-state="connecting">CONNECTING…</span></div>
		<div class="hud bottom-right" id="stats"></div>

		<div id="loading" hidden>
			<div class="bar"><div id="loading-fill"></div></div>
			<div id="loading-text"></div>
		</div>
		<div class="hud bottom-center" id="assets-status"></div>
		<canvas id="gui"></canvas>
		<div id="message" hidden></div>

		<form id="settings" class="panel" hidden onsubmit="return false">
			<header>
				<strong>Picture settings</strong>
				<button type="button" id="close-settings" title="Close">✕</button>
			</header>
			<label>Graphics
				<select data-setting="graphics">
					<option value="vanilla">Minecraft (vanilla)</option>
					<option value="shaders">Shaders (shadows, waves, glow)</option>
				</select>
			</label>
			<label>Shader quality
				<select data-setting="shaderQuality">
					<option value="low">Low</option>
					<option value="medium">Medium</option>
					<option value="high">High</option>
					<option value="ultra">Ultra</option>
				</select>
			</label>
			<label>Post effect (shader)
				<select data-setting="postShader">
					<option value="">None</option>
				</select>
			</label>
			<label>Field of view
				<select data-setting="fov">
					<option value="">Camera's own</option>
					<option value="30">30°</option>
					<option value="50">50°</option>
					<option value="60">60°</option>
					<option value="70">70° (Normal)</option>
					<option value="80">80°</option>
					<option value="90">90°</option>
					<option value="100">100°</option>
					<option value="110">110° (Quake Pro)</option>
				</select>
			</label>
			<label>Distance fog
				<select data-setting="fog">
					<option value="vanilla">Minecraft</option>
					<option value="smooth">Smooth fade</option>
					<option value="atmospheric">Atmospheric haze</option>
					<option value="minimal">Minimal (edge only)</option>
				</select>
			</label>
			<label>Music (with sound on)
				<select data-setting="music">
					<option value="off">Off</option>
					<option value="default">Default (like Minecraft)</option>
					<option value="frequent">Frequent</option>
					<option value="constant">Constant</option>
				</select>
			</label>
			<label>Now Playing toast
				<select data-setting="musicToast">
					<option value="on">Show when a song starts</option>
					<option value="off">Never</option>
				</select>
			</label>
			<label>Timelapse: one picture every
				<select data-setting="timelapse">
					<option value="1">second</option>
					<option value="2">2 seconds</option>
					<option value="5">5 seconds</option>
					<option value="10">10 seconds</option>
					<option value="30">30 seconds</option>
					<option value="60">minute</option>
					<option value="300">5 minutes</option>
				</select>
			</label>
			<label>Biome blend
				<select data-setting="blend">
					<option value="0">Off</option>
					<option value="1">3x3</option>
					<option value="2">5x5 (Minecraft's default)</option>
					<option value="3">7x7</option>
					<option value="4">9x9</option>
					<option value="5">11x11</option>
					<option value="6">13x13</option>
					<option value="7">15x15</option>
				</select>
			</label>
			<label>Sky
				<select data-setting="skybox">
					<option value="default">Server default</option>
					<option value="none">Minecraft</option>
				</select>
			</label>
			<label>Clouds
				<select data-setting="clouds">
					<option value="fancy">Fancy</option>
					<option value="fast">Fast</option>
					<option value="off">Off</option>
				</select>
			</label>
			<label>Camera mode
				<select data-setting="mode">
					<option value="color">Colour</option>
					<option value="mono">Black and white</option>
					<option value="night">Night vision</option>
				</select>
			</label>
			<label>Render resolution
				<select data-setting="renderScale">
					<option value="0.5">50% (weak GPU)</option>
					<option value="0.75">75%</option>
					<option value="1">100%</option>
				</select>
			</label>
			<label class="check"><input type="checkbox" data-setting="labels"> Name tags (visible players and named mobs)</label>
			<label class="check"><input type="checkbox" data-setting="mobLabels"> Mob labels</label>
			<label class="check"><input type="checkbox" data-setting="particles"> Particles (flames, smoke, drips, leaves)</label>
			<label class="check"><input type="checkbox" data-setting="cctvEffect"> CCTV effect (scan lines)</label>
			<footer>
				<button type="button" id="settings-reset">Restore server defaults</button>
			</footer>
		</form>
	</div>

	<nav id="toolbar">
		<a href="/" id="back" class="button">◀ All cameras</a>
		<span class="spacer"></span>
		<button type="button" id="open-settings" class="unlocked-only" title="Graphics, shaders, sky, labels">⚙ Settings</button>
		<button type="button" id="sound" title="Hear the game's sounds at the camera">🔈 Sound off</button>
		<button type="button" id="record" hidden title="Record a video of the camera (downloaded by your browser)">⏺ Record</button>
		<button type="button" id="timelapse" hidden title="Keep a picture every few seconds and save them as a video when stopped (interval in Settings)">⏱ Timelapse</button>
		<button type="button" id="reset-view" title="Drag with the mouse to look around; wheel = zoom">Reset view</button>
		<button type="button" id="fullscreen">Fullscreen</button>
	</nav>

	<script type="module" src="/static/app.js"></script>
</body>
</html>
