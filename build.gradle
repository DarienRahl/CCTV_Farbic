plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = "cctv-fabric"
}

repositories {
	// Loom adds the repositories needed for Minecraft, Fabric Loader and Fabric API.
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

loom {
	runs {
		server {
			// Development runs (and the CI server test) list thread stacks on /api/status.
			vmArg "-Dcctv.debug=true"
		}
	}
}

// Reference renders (CI): a client game test in src/gametest builds a scene in single player, takes the game's
// picture and puts a camera at the same spot for the viewer's picture (runClientGameTest, see build.yml).
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "cctv-reference-renders"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

tasks.matching { it.name == "runClientGameTest" }.configureEach {
	// the network synchronizer of client game tests can fail on CI machines (Fabric's documentation)
	jvmArgs "-Dfabric.client.gametest.disableNetworkSynchronizer=true"
}
