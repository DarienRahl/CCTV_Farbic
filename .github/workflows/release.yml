# Publishes a GitHub release when a version tag (v1.2.3) is pushed:
# builds the mod and attaches the jar. Notes come from docs/release-notes/<tag>.md.

name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: check that the tag matches the mod version
        run: |
          VERSION=$(grep '^version=' gradle.properties | cut -d= -f2)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version=$VERSION in gradle.properties"
            exit 1
          fi
      - name: build
        run: |
          chmod +x ./gradlew
          ./gradlew build
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="docs/release-notes/$GITHUB_REF_NAME.md"
          if [ -f "$NOTES" ]; then NOTES_ARG=(--notes-file "$NOTES"); else NOTES_ARG=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" build/libs/cctv-fabric-*[0-9].jar \
            --title "CCTV $GITHUB_REF_NAME (Minecraft 26.3)" "${NOTES_ARG[@]}"
