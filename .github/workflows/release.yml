# Publishes a GitHub release with the mod jar attached.
#
# Either push a version tag (v1.2.3) or run this workflow manually
# ("Run workflow" in the Actions tab): then the tag v<version> is taken from
# gradle.properties and created on the selected commit. Release notes come
# from docs/release-notes/<tag>.md when that file exists; the notes of
# earlier releases are refreshed from their files as well.

name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: determine tag
        run: |
          VERSION=$(grep '^version=' gradle.properties | cut -d= -f2)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
            if [ "$TAG" != "v$VERSION" ]; then
              echo "Tag $TAG does not match version=$VERSION in gradle.properties"
              exit 1
            fi
          else
            TAG="v$VERSION"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
      - name: build
        run: |
          chmod +x ./gradlew
          ./gradlew build
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists - bump version in gradle.properties first."
            exit 1
          fi
          NOTES="docs/release-notes/$TAG.md"
          if [ -f "$NOTES" ]; then NOTES_ARG=(--notes-file "$NOTES"); else NOTES_ARG=(--generate-notes); fi
          gh release create "$TAG" build/libs/cctv-fabric-*[0-9].jar \
            --target "$GITHUB_SHA" \
            --title "CCTV $TAG (Minecraft 26.3)" "${NOTES_ARG[@]}"
      - name: sync notes of earlier releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Keeps published release descriptions in line with docs/release-notes (e.g. after edits).
          for file in docs/release-notes/v*.md; do
            tag=$(basename "$file" .md)
            if [ "$tag" != "$TAG" ] && gh release view "$tag" > /dev/null 2>&1; then
              gh release edit "$tag" --notes-file "$file"
              echo "Updated notes of $tag"
            fi
          done
