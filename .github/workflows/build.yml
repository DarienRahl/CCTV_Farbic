# Builds the mod on every push and pull request (the jar is attached to the run
# as the "cctv-fabric" artifact), then starts a real dedicated server with the
# mod and checks the camera stream end to end.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cctv-fabric
          path: build/libs/

  server-test:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: prepare dedicated server
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          cat > run/server.properties <<'PROPS'
          enable-rcon=true
          rcon.password=cctv-ci
          rcon.port=25575
          online-mode=false
          level-type=minecraft\:flat
          generate-structures=false
          spawn-protection=0
          view-distance=4
          simulation-distance=4
          PROPS
      - name: start server with the mod
        run: |
          chmod +x ./gradlew
          nohup ./gradlew runServer --no-daemon > server.log 2>&1 &
      - name: smoke test (RCON + live stream)
        run: python3 .github/e2e/smoke_test.py
      - name: viewer screenshot
        working-directory: .github/e2e
        run: |
          npm install --no-save --no-package-lock playwright@1 > /dev/null
          npx playwright install --with-deps chromium > /dev/null 2>&1
          node screenshot.mjs
      - name: dump entity models (temporary, for viewer development)
        if: always()
        run: |
          curl -s -H 'Accept-Encoding: gzip' -o models.json.gz http://127.0.0.1:8100/assets/models.json || true
          ls -l models.json.gz || true
          gunzip -c models.json.gz | python3 -c "import json,sys; d=json.load(sys.stdin); print('LAYERS', len(d['layers'])); print(' '.join(sorted(d['layers'])))" || true
          base64 -w 4000 models.json.gz | sed 's/^/MODELS:/' || true
      - name: stop server
        if: always()
        run: |
          python3 .github/e2e/smoke_test.py --stop || true
          sleep 10
          grep -iE "cctv|error|exception" server.log | tail -n 60 || true
      - name: upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: server-test
          path: |
            server.log
            .github/e2e/*.png
