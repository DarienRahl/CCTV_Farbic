# Builds the mod on every push and pull request (the jar is attached to the run
# as the "cctv-fabric" artifact), then starts a real dedicated server with the
# mod and checks the camera stream end to end.

name: build
on:
  pull_request:
  push:
  workflow_call:
    inputs:
      ref:
        description: Branch or commit to build (used by update-minecraft)
        type: string
        default: ''

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - name: roadmap pictures and README are up to date
        # regenerate with: python3 .github/scripts/roadmap.py (after editing docs/ROADMAP.md)
        run: python3 .github/scripts/roadmap.py --check
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cctv-fabric
          path: build/libs/

  server-test:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: prepare dedicated server
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          cat > run/server.properties <<'PROPS'
          enable-rcon=true
          rcon.password=cctv-ci
          rcon.port=25575
          online-mode=false
          level-type=minecraft\:flat
          generate-structures=false
          spawn-protection=0
          view-distance=4
          simulation-distance=4
          PROPS
      - name: start server with the mod
        run: |
          chmod +x ./gradlew
          nohup ./gradlew runServer --no-daemon > server.log 2>&1 &
      - name: smoke test (RCON + live stream)
        run: python3 .github/e2e/smoke_test.py
      - name: viewer screenshot
        working-directory: .github/e2e
        run: |
          npm install --no-save --no-package-lock playwright@1 > /dev/null
          npx playwright install --with-deps chromium > /dev/null 2>&1
          node screenshot.mjs
      - name: stop server
        if: always()
        run: |
          python3 .github/e2e/smoke_test.py --stop || true
          sleep 10
          grep -iE "cctv|error|exception" server.log | tail -n 60 || true
      - name: upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: server-test
          path: |
            server.log
            .github/e2e/*.png

  # Reference renders: the game itself (a Fabric client game test under a virtual display) and the viewer take a
  # picture of the same scene from the same eyes; both go into the job summary and the "reference-renders" artifact
  # side by side with a difference score. Informational while it settles in.
  reference-renders:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: virtual display, software OpenGL and the comparison's Python packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils mesa-vulkan-drivers libvulkan1 vulkan-tools > /dev/null
          pip install --quiet pillow
      - name: install playwright
        working-directory: .github/e2e
        run: |
          npm install --no-save --no-package-lock playwright@1 > /dev/null
          npx playwright install --with-deps chromium > /dev/null 2>&1
      - name: the game's and the viewer's picture
        timeout-minutes: 30
        run: |
          chmod +x ./gradlew
          .github/e2e/reference.sh
      - name: compare
        if: always()
        run: python3 .github/e2e/compare_reference.py build/run/clientGameTest/reference
      - name: upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reference-renders
          path: |
            build/run/clientGameTest/reference/
            build/run/clientGameTest/screenshots/
            game.log
            reference-viewer.log
