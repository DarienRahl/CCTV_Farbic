# Developer tool: prints signatures (javap) or decompiled sources (Vineflower) of
# Minecraft classes into the job log. Useful when porting client behaviour to the
# web viewer, because the viewer re-implements parts of the client renderer.
# Run it from the Actions tab ("Run workflow").

name: inspect-minecraft
on:
  workflow_dispatch:
    inputs:
      version:
        description: Minecraft version
        default: '26.3'
      list:
        description: Regex; lists matching class files of the client jar
        default: ''
      javap:
        description: Space separated class names for javap -p (client jar contains the common classes too)
        default: ''
      decompile:
        description: Space separated class paths to decompile, e.g. net/minecraft/client/renderer/LightTexture (inner classes included)
        default: ''
      extract:
        description: Regex of client jar entries to attach as the "extracted" artifact, e.g. ^assets/minecraft/font/
        default: ''
      compare_with:
        description: Older version; decompiles the game classes the viewer ports (docs/ported-classes.txt) in both versions and prints the differences
        default: ''

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
        with:
          path: repo
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: download jars
        env:
          MC_VERSION: ${{ inputs.version }}
        run: |
          python3 repo/.github/scripts/fetch_minecraft.py "$MC_VERSION" client.jar server.jar
          curl -sSfL -o vineflower.jar https://repo1.maven.org/maven2/org/vineflower/vineflower/1.11.1/vineflower-1.11.1.jar
      - name: list classes
        if: inputs.list != ''
        env:
          PATTERN: ${{ inputs.list }}
        run: unzip -Z1 client.jar | grep -E "$PATTERN" | head -n 2000
      - name: javap
        if: inputs.javap != ''
        env:
          CLASSES: ${{ inputs.javap }}
        run: |
          for cls in $CLASSES; do
            echo "=================== $cls"
            javap -p -constants -cp client.jar:server.jar "$cls" || true
          done
      - name: decompile
        if: inputs.decompile != ''
        env:
          CLASSES: ${{ inputs.decompile }}
        run: |
          mkdir -p classes out
          for cls in $CLASSES; do
            (cd classes && unzip -qo ../client.jar "$cls.class" "$cls\$*.class" || true)
          done
          java -jar vineflower.jar -dgs=1 -rsy=1 -log=WARN -e=client.jar classes out > /dev/null 2>&1 || true
          find out -name '*.java' | sort | while read -r file; do
            echo "=================== $file"
            cat "$file"
          done
      - name: extract
        if: inputs.extract != ''
        env:
          PATTERN: ${{ inputs.extract }}
        run: |
          mkdir -p extracted
          unzip -Z1 client.jar | grep -E "$PATTERN" | head -n 5000 > entries.txt
          wc -l entries.txt
          (cd extracted && xargs -a ../entries.txt -d '\n' unzip -qo ../client.jar)
          (cd extracted && zip -qr ../extracted.zip .)
          ls -l extracted.zip
          # Small extracts are also printed (base64) so they can be read from the log.
          if [ "$(stat -c %s extracted.zip)" -lt 300000 ]; then
            base64 -w 4000 extracted.zip | sed 's/^/EXTRACT:/'
          fi
      - name: upload extracted files
        if: inputs.extract != ''
        uses: actions/upload-artifact@v7
        with:
          name: extracted
          path: extracted.zip
      - name: diff ported classes
        if: inputs.compare_with != ''
        env:
          OLD: ${{ inputs.compare_with }}
          NEW: ${{ inputs.version }}
        run: |
          python3 repo/.github/scripts/fetch_minecraft.py "$OLD" old-client.jar
          decompile() {
            rm -rf "cls-$2" "src-$2" && mkdir -p "cls-$2" "src-$2"
            grep -vE '^\s*(#|$)' repo/docs/ported-classes.txt | while read -r cls; do
              (cd "cls-$2" && unzip -qo "../$1" "$cls.class" "$cls\$*.class" 2>/dev/null || true)
            done
            java -jar vineflower.jar -dgs=1 -rsy=1 -log=WARN -e="$1" "cls-$2" "src-$2" > /dev/null 2>&1 || true
          }
          decompile old-client.jar "$OLD"
          decompile client.jar "$NEW"
          echo "Changes in the ported game classes from $OLD to $NEW:"
          diff -ru "src-$OLD" "src-$NEW" || true
